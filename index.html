<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>PPT生成</title>
<style>
*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(100%,560px);margin:auto;padding:16px 12px 42px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-size:1.65rem;text-align:center;margin:6px 0 16px}.section-title{font-size:1.2rem;font-weight:800;margin:4px 0 10px}
textarea{width:100%;height:170px;resize:none;overflow:auto;border:2px solid #d9dee8;border-radius:14px;padding:14px;font:inherit;line-height:1.65;background:#fff;color:#172033}
button{font-family:inherit}.primary,.secondary,.danger{width:100%;min-height:54px;border:0;border-radius:14px;font-size:1.08rem;font-weight:750;margin-top:10px}.primary{background:#1769e0;color:#fff}.secondary{background:#eaf2ff;color:#174ea6}.danger{background:#fff0f0;color:#b42318}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.row4 button{min-height:50px;border:0;border-radius:12px;font-size:.94rem;font-weight:750;padding:6px 2px}.summary{height:230px;overflow:auto;border:2px solid #e3e7ee;border-radius:14px;padding:14px;font-size:1.08rem;line-height:1.85;white-space:pre-wrap;background:#fbfcfe}.summary.editing{background:#fffbea;border-color:#f2c94c;outline:none}.hidden{display:none!important}
.version{text-align:center;font-size:.78rem;color:#98a2b3;margin:16px 0 0}.history-item{border-top:1px solid #e5e7eb;padding:14px 0}.history-item:first-child{border-top:0}.history-date{font-size:.82rem;color:#667085}.history-preview{line-height:1.55;margin:7px 0}.item-actions{display:flex;gap:8px}.item-actions button{flex:1;min-height:42px;border:0;border-radius:10px;font-size:.92rem}.empty{text-align:center;color:#98a2b3;padding:20px}
#pptArea{margin-top:14px}.ppt-title{text-align:center;font-size:1.28rem;font-weight:850;margin:8px 0 14px}.slide{aspect-ratio:16/9;width:100%;border-radius:16px;margin:0 0 15px;box-shadow:0 10px 28px rgba(16,24,40,.16);padding:7% 7.5%;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}.slide.paper{background:linear-gradient(145deg,#fff 0%,#f3f6fb 100%);color:#14213d}.slide.navy{background:radial-gradient(circle at 85% 15%,#315b9b 0%,#14213d 38%,#081426 100%);color:#fff}.slide.sand{background:linear-gradient(145deg,#fff9ef,#eadbc4);color:#30261f}.slide.ink{background:linear-gradient(145deg,#1b1f2a,#303747);color:#fff}.slide .accent{position:absolute;left:0;top:0;width:7px;height:100%;background:#d5a021}.slide.paper .accent{background:#1769e0}.slide.sand .accent{background:#b54708}.slide .eyebrow{font-size:clamp(.48rem,1.8vw,.68rem);font-weight:800;letter-spacing:.18em;opacity:.58;margin-bottom:4%}.slide .num{position:absolute;right:5%;bottom:5%;font-size:.62rem;opacity:.45;letter-spacing:.08em}.slide h2{font-size:clamp(1.38rem,5.4vw,2.1rem);margin:0 0 5%;line-height:1.15;letter-spacing:-.02em;max-width:90%}.slide p{font-size:clamp(1.18rem,4.8vw,1.7rem);line-height:1.35;margin:0;font-weight:800}.slide.body-keywords p{display:grid;grid-template-columns:1fr;gap:.36em}.slide.body-keywords .bullet{margin:.18em 0}.slide.body-keywords .bullet b{display:none}.slide.body-keywords .bullet em{font-size:1.12em;font-weight:850;letter-spacing:.03em}.slide .bullet{display:grid;grid-template-columns:2.1em 1fr;gap:.6em;align-items:start;margin:.52em 0}.slide .bullet b{font:700 .72em/1.6 Arial;opacity:.48}.slide .bullet em{font-style:normal;font-weight:560}.slide.cover{text-align:left;align-items:flex-start;padding-left:10%}.slide.cover:after{content:"";position:absolute;width:34%;aspect-ratio:1;border:1px solid rgba(255,255,255,.14);border-radius:50%;right:-8%;top:-15%;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}.slide.cover h2{font-size:clamp(1.75rem,6.5vw,2.55rem);max-width:82%;margin-bottom:4%}.slide.cover p{font-size:clamp(.72rem,2.8vw,1rem);opacity:.72;letter-spacing:.05em}.slide.editable{outline:3px solid #f2c94c;cursor:text}.slide[contenteditable="true"]{user-select:text;-webkit-user-select:text}
@media(max-width:380px){html{font-size:17px}main{padding-left:9px;padding-right:9px}.row4{grid-template-columns:1fr 1fr}.row4 button{font-size:1rem}}
</style>
</head>
<body><main>
<section id="home">
  <div class="card" id="level1">
    <h1>PPT生成</h1>
    <textarea id="sourceText" placeholder="在这里粘贴文章……"></textarea>
    <button id="extractBtn" class="primary">开始提炼</button>
    <button id="historyBtn" class="secondary">历史记录</button>
    <div class="version">V1.1.4 · 260830-2035</div>
  </div>

  <div id="level2" class="hidden">
    <div class="card">
      <div class="section-title">精华</div>
      <div id="summary" class="summary"></div>
      <div class="row"><button id="enhanceBtn" class="secondary">增强</button><button id="speakToggleBtn" class="secondary">朗读/停止</button></div>
      <div class="row"><button id="generatePptBtn" class="primary">PPT生成</button><button id="clearSummaryBtn" class="danger">清屏</button></div>
    </div>
  </div>

  <div id="level3" class="hidden">
    <div class="card">
      <div id="pptArea"></div>
      <div class="row4">
        <button id="editPptBtn" class="secondary">修改</button>
        <button id="savePptBtn" class="secondary">保存</button>
        <button id="downloadPptBtn" class="primary">下载</button>
        <button id="clearPptBtn" class="danger">清屏</button>
      </div>
    </div>
  </div>
</section>

<section id="historyPanel" class="hidden">
  <div class="card">
    <h1>历史记录</h1>
    <button id="backBtn" class="secondary">返回</button>
    <div id="historyList"></div>
    <button id="clearHistoryBtn" class="danger">清空历史</button>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
const $=id=>document.getElementById(id), clean=s=>(s||"").replace(/\s+/g,"").trim();
const STOP=new Set("的 了 和 是 在 有 我 你 他 她 它 这 那 就 也 都 而 与 及 或 被 把 对 为 从 到 将 一个 一种 我们 他们 可以 需要 进行 以及 如果 因为 所以 但是 不是 没有 什么 如何 这个 那个 这些 那些".split(" "));
const KEY="pptGeneratorHistoryV1"; let current=null, speaking=false, pptEditing=false;
function sentences(text){return (text||"").replace(/\r/g,"").split(/(?<=[。！？!?；;])|\n+/).map(s=>s.trim()).filter(Boolean)}
function targetLen(text){const n=clean(text).length;return n?Math.max(20,Math.round(n/30)):0}
function tokens(text){const zh=(text.match(/[\u4e00-\u9fff]{2,6}/g)||[]),en=(text.toLowerCase().match(/[a-z][a-z0-9-]{2,}/g)||[]),parts=[];zh.forEach(x=>{for(let n=Math.min(4,x.length);n>=2;n--)for(let i=0;i+n<=x.length;i++)parts.push(x.slice(i,i+n))});return parts.concat(en).filter(x=>!STOP.has(x))}
function keywords(text,max=10){const f=new Map();tokens(text).forEach(t=>f.set(t,(f.get(t)||0)+1));let a=[...f].sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).map(x=>x[0]),out=[];for(const w of a){if(!out.some(x=>x.includes(w)||w.includes(x))){out.push(w);if(out.length>=max)break}}return out}
function paragraphBlocks(text){return (text||"").replace(/\r/g,"").split(/\n{2,}|\n/).map(x=>x.trim()).filter(x=>clean(x).length>=8)}
function sentenceInfo(text){const ss=sentences(text),ks=keywords(text,14);return ss.map((s,i)=>{const norm=clean(s),hits=ks.filter(k=>s.includes(k));return{s,i,len:norm.length,hits,score:hits.length*3+Math.min(norm.length/45,1.2)+(i===0?1.3:0)+(i===ss.length-1?1:0)+(/[因此所以由此可见总之可见说明意味着关键核心本质值得注意]/.test(s)?1.5:0)+(/[但是然而不过却而是并非]/.test(s)?.8:0)}})}
function similarity(a,b){const A=new Set(tokens(a)),B=new Set(tokens(b));if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>B.has(x)&&n++);return n/Math.max(1,Math.min(A.size,B.size))}
function summarize(text,target){const info=sentenceInfo(text);if(!info.length)return"";if(clean(text).length<=Math.max(target*2,100))return info.map(x=>x.s).join("");const paras=paragraphBlocks(text),wanted=Math.max(target,30),hard=Math.max(Math.round(wanted*2.2),90),picked=[];function add(x){if(!x||picked.some(y=>y.i===x.i))return false;if(picked.length&&picked.reduce((n,y)=>n+y.len,0)+x.len>hard)return false;if(picked.some(y=>similarity(y.s,x.s)>.72))return false;picked.push(x);return true}
 // 先保证全文覆盖：开头、各主要段落、结尾都有代表句
 add(info[0]);
 const major=paras.length?paras: [text];
 major.forEach(p=>{const cand=info.filter(x=>p.includes(x.s)).sort((a,b)=>b.score-a.score)[0];add(cand)});
 add(info[info.length-1]);
 // 再补全高价值观点，兼顾尚未覆盖的主题词
 const covered=new Set(picked.flatMap(x=>x.hits));
 const ranked=[...info].sort((a,b)=>{const na=a.hits.filter(k=>!covered.has(k)).length,nb=b.hits.filter(k=>!covered.has(k)).length;return (b.score+nb*2)-(a.score+na*2)||a.i-b.i});
 for(const x of ranked){if(picked.reduce((n,y)=>n+y.len,0)>=wanted*1.45)break;if(add(x))x.hits.forEach(k=>covered.add(k))}
 picked.sort((a,b)=>a.i-b.i);let out=picked.map(x=>x.s.trim()).join("");if(out&&!/[。！？!?]$/.test(out))out+="。";return out}
function enhanceSummary(src,cur,target){const info=sentenceInfo(src),ks=keywords(src,16);if(!info.length)return cur;const max=Math.max(Math.round(target*2.5),110),chosen=[];let len=0,covered=new Set();for(let round=0;round<2;round++){for(const x of [...info].sort((a,b)=>{const an=a.hits.filter(k=>!covered.has(k)).length,bn=b.hits.filter(k=>!covered.has(k)).length;return (b.score+bn*2.2)-(a.score+an*2.2)||a.i-b.i})){if(chosen.some(y=>y.i===x.i)||chosen.some(y=>similarity(y.s,x.s)>.68))continue;if(len+x.len>max&&chosen.length)continue;chosen.push(x);len+=x.len;x.hits.forEach(k=>covered.add(k));if(len>=target*1.7&&covered.size>=Math.min(6,ks.length))break}if(len>=target*1.7)break}chosen.sort((a,b)=>a.i-b.i);let t=chosen.map(x=>x.s.replace(/^[，、；;：:\s]+/,"")).join("").replace(/([。！？])\1+/g,"$1");if(t&&!/[。！？!?]$/.test(t))t+="。";return t||cur}
function makeTitle(summary,ks){let first=sentences(summary)[0]||"内容提炼";first=first.replace(/[。！？；].*$/g,"");if(first.length>20)first=(ks.slice(0,2).join(" · ")||first.slice(0,18));return first||"内容提炼"}
function pptKeywords(summary,max=24){const clauses=(summary||"").split(/[。！？!?；;，,：:\n]+/).map(x=>x.trim()).filter(x=>clean(x).length>=4),out=[];for(const c of clauses){for(const w of keywords(c,3)){if(w.length<2||w.length>8)continue;if(!out.some(x=>x===w||x.includes(w)||w.includes(x))){out.push(w);if(out.length>=max)return out}}}for(const w of keywords(summary,max)){if(w.length>=2&&w.length<=8&&!out.some(x=>x===w||x.includes(w)||w.includes(x))){out.push(w);if(out.length>=max)break}}return out}
function shortIdea(s,ks){let t=(s||"").replace(/^[，、；;：:\s]+/,"").replace(/[。！？!?；;]+$/g,"").trim();if(t.length<=26)return t;const hit=ks.find(k=>t.includes(k));if(hit){const at=t.indexOf(hit),a=Math.max(0,at-7);return (a>0?"…":"")+t.slice(a,a+28)+(a+28<t.length?"…":"")}return t.slice(0,28)+"…"}
function ideaSlides(summary){const ss=sentences(summary).filter(s=>clean(s).length>=8),ks=pptKeywords(summary,24),items=[];for(const s of ss){const local=keywords(s,4).filter(w=>w.length>=2&&w.length<=8),title=local[0]||ks.find(k=>s.includes(k))||"核心观点",idea=shortIdea(s,local.length?local:ks);if(!idea)continue;if(items.some(x=>similarity(x.idea,idea)>.66))continue;items.push({title,idea,tags:local.slice(1,3)});if(items.length>=6)break}if(items.length<2){for(let i=0;i<ks.length&&items.length<4;i+=2)items.push({title:ks[i]||"核心观点",idea:[ks[i],ks[i+1]].filter(Boolean).join(" · "),tags:[]})}return items}
function buildDeck(summary){const ks=pptKeywords(summary,24),title=makeTitle(summary,ks),ideas=ideaSlides(summary);let slides=[{type:"cover",title,text:ks.slice(0,3).join(" · ")||"精华提炼",theme:"navy"}];ideas.forEach((x,i)=>{const lines=[x.idea,...x.tags.map(t=>"关键词 · "+t)].slice(0,3);slides.push({type:"body",title:x.title,text:lines.join("\n"),theme:["paper","navy","sand","ink"][i%4],accent:x.title})});const take=ideas.slice(0,4).map(x=>x.title+"："+x.idea.slice(0,16));slides.push({type:"end",title:"核心带走",text:(take.length?take:ks.slice(0,5)).map(x=>"• "+x).join("\n"),theme:"navy"});return{title,slides}}
function renderDeck(deck){const box=$("pptArea");box.innerHTML='<div class="ppt-title">'+esc(deck.title)+'</div>'+deck.slides.map((s,i)=>{const lines=(s.text||"").split("\n").filter(Boolean);const body=lines.map((x,j)=>'<span class="bullet"><b>'+(j+1).toString().padStart(2,"0")+'</b><em>'+esc(x.replace(/^•\s*/,''))+'</em></span>').join("");return '<div class="slide '+(s.type==="cover"?'cover navy':(s.theme||"paper"))+'" data-i="'+i+'"><div class="accent"></div><div class="eyebrow">'+(s.type==="cover"?'PRESENTATION':s.type==="end"?'TAKEAWAYS':'KEY IDEA')+'</div><h2>'+esc(s.title)+'</h2><p>'+(s.type==="cover"?esc(s.text):body)+'</p><span class="num">'+String(i+1).padStart(2,"0")+' / '+String(deck.slides.length).padStart(2,"0")+'</span></div>'}).join("");}
function syncDeckFromDom(){if(!current?.deck)return;document.querySelectorAll("#pptArea .slide").forEach(el=>{const i=+el.dataset.i;current.deck.slides[i].title=el.querySelector("h2").innerText.trim();current.deck.slides[i].text=el.querySelector("p").innerText.trim()});current.deck.title=current.deck.slides[0]?.title||current.deck.title;current.dirty=true}
function setEdit(on){pptEditing=on;document.querySelectorAll("#pptArea .slide").forEach(el=>{el.contentEditable=on?"true":"false";el.classList.toggle("editable",on)});$("editPptBtn").textContent=on?"完成修改":"修改";if(!on)syncDeckFromDom()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loadHistory(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function saveHistoryRecord(){if(!current?.deck)return;syncDeckFromDom();let a=loadHistory(),now=new Date().toISOString(),id=current.savedId||Date.now(),r={id,createdAt:now,source:current.source,summary:current.summary,deck:current.deck};a=a.filter(x=>x.id!==id);a.unshift(r);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)));current.savedId=id;current.dirty=false;alert("已保存到历史记录。")}
function renderHistory(){const a=loadHistory(),box=$("historyList");if(!a.length){box.innerHTML='<div class="empty">还没有历史记录</div>';return}box.innerHTML=a.map(r=>'<div class="history-item" data-id="'+r.id+'"><div class="history-date">'+new Date(r.createdAt).toLocaleString("zh-CN")+'</div><div class="history-preview">'+esc(r.deck?.title||r.summary?.slice(0,40)||"PPT")+'</div><div class="item-actions"><button class="open secondary">打开</button><button class="del danger">删除</button></div></div>').join("")}
function speakToggle(){if(!("speechSynthesis" in window)){alert("当前浏览器不支持朗读。");return}if(speaking||speechSynthesis.speaking){speechSynthesis.cancel();speaking=false;return}if(!current?.summary)return;const u=new SpeechSynthesisUtterance(current.summary);u.lang="zh-CN";u.rate=.92;u.onend=()=>speaking=false;u.onerror=()=>speaking=false;speaking=true;speechSynthesis.speak(u)}
async function downloadPpt(){if(!current?.deck)return;syncDeckFromDom();if(typeof PptxGenJS==="undefined"){alert("PPT下载组件未加载，请联网后重新打开网页再下载。");return}const pptx=new PptxGenJS();pptx.layout="LAYOUT_WIDE";pptx.author="PPT生成";pptx.subject=current.deck.title;pptx.title=current.deck.title;pptx.company="PPT生成";pptx.lang="zh-CN";const themes={paper:{bg:"F7F9FC",fg:"14213D",accent:"1769E0"},navy:{bg:"0B1830",fg:"FFFFFF",accent:"D5A021"},sand:{bg:"F7EEDC",fg:"30261F",accent:"B54708"},ink:{bg:"232936",fg:"FFFFFF",accent:"D5A021"}};current.deck.slides.forEach((s,i)=>{const slide=pptx.addSlide(),th=themes[s.theme]||themes.paper;slide.background={color:th.bg};slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:.09,h:7.5,fill:{color:th.accent},line:{color:th.accent}});slide.addText(s.type==="cover"?"PRESENTATION":s.type==="end"?"TAKEAWAYS":"KEY IDEA",{x:.8,y:.55,w:3,h:.25,fontFace:"Arial",fontSize:8,bold:true,charSpacing:2,color:th.fg,transparency:45,margin:0});if(s.type==="cover"){slide.addText(s.title,{x:1.15,y:2.05,w:9.9,h:1.35,fontFace:"Microsoft YaHei",fontSize:30,bold:true,color:th.fg,margin:0,breakLine:false});slide.addText(s.text,{x:1.18,y:3.55,w:9.4,h:.55,fontFace:"Microsoft YaHei",fontSize:13,color:th.fg,transparency:22,margin:0});slide.addShape(pptx.ShapeType.ellipse,{x:10.9,y:-.55,w:3.3,h:3.3,fill:{color:th.accent,transparency:88},line:{color:th.accent,transparency:72,width:1}})}else{slide.addText(s.title,{x:.85,y:1.08,w:11.2,h:.72,fontFace:"Microsoft YaHei",fontSize:25,bold:true,color:th.fg,margin:0});const lines=(s.text||"").split("\n").filter(Boolean).slice(0,4);let y=2.05;lines.forEach((line,j)=>{slide.addText(line.replace(/^•\s*/,''),{x:1.35,y,w:10.8,h:1.05,fontFace:"Microsoft YaHei",fontSize:30,bold:true,color:th.fg,margin:0,breakLine:false,fit:"shrink"});y+=1.25})}slide.addText(String(i+1).padStart(2,"0")+" / "+String(current.deck.slides.length).padStart(2,"0"),{x:11.65,y:6.9,w:.8,h:.22,fontFace:"Arial",fontSize:7,color:th.fg,transparency:50,align:"right",margin:0})});const safe=(current.deck.title||"PPT生成").replace(/[\\/:*?"<>|]/g,"_").slice(0,28);await pptx.writeFile({fileName:safe+".pptx"});}


function clearToStart(){if(window.speechSynthesis)window.speechSynthesis.cancel();speaking=false;if(pptEditing)setEdit(false);$("pptArea").innerHTML="";$("summary").textContent="";$("sourceText").value="";$("level3").classList.add("hidden");$("level2").classList.add("hidden");current=null;window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>$("sourceText").focus(),350)}
$("extractBtn").onclick=()=>{const src=$("sourceText").value;if(!clean(src)){alert("请先粘贴文章。");return}const target=targetLen(src),sum=summarize(src,target);current={source:src,summary:sum,target,deck:null,dirty:false,savedId:null};$("summary").textContent=sum;$("level2").classList.remove("hidden");$("level3").classList.add("hidden");$("level2").scrollIntoView({behavior:"smooth",block:"start"})};
$("enhanceBtn").onclick=()=>{if(!current)return;current.summary=enhanceSummary(current.source,current.summary,current.target);$("summary").textContent=current.summary;current.deck=null;current.dirty=true;$("level3").classList.add("hidden")};
$("speakToggleBtn").onclick=speakToggle;
$("clearSummaryBtn").onclick=clearToStart;
$("generatePptBtn").onclick=()=>{if(!current)return;current.summary=$("summary").innerText.trim()||current.summary;current.deck=buildDeck(current.summary);current.dirty=true;renderDeck(current.deck);$("level3").classList.remove("hidden");setEdit(false);$("level3").scrollIntoView({behavior:"smooth",block:"start"})};
$("editPptBtn").onclick=()=>setEdit(!pptEditing);$("savePptBtn").onclick=saveHistoryRecord;$("downloadPptBtn").onclick=downloadPpt;
$("clearPptBtn").onclick=()=>{if(!current?.deck)return;if(current.dirty&&!current.savedId){alert("请先保存到历史记录，再清屏。");return}clearToStart()};
$("historyBtn").onclick=()=>{$("home").classList.add("hidden");$("historyPanel").classList.remove("hidden");renderHistory();window.scrollTo(0,0)};$("backBtn").onclick=()=>{$("historyPanel").classList.add("hidden");$("home").classList.remove("hidden");window.scrollTo(0,0)};
$("historyList").onclick=e=>{const item=e.target.closest(".history-item");if(!item)return;let a=loadHistory(),id=Number(item.dataset.id),r=a.find(x=>x.id===id);if(e.target.classList.contains("del")){localStorage.setItem(KEY,JSON.stringify(a.filter(x=>x.id!==id)));renderHistory();return}if(e.target.classList.contains("open")&&r){current={source:r.source||"",summary:r.summary||"",target:targetLen(r.source||""),deck:r.deck,dirty:false,savedId:r.id};$("sourceText").value=current.source;$("summary").textContent=current.summary;renderDeck(current.deck);$("level2").classList.remove("hidden");$("level3").classList.remove("hidden");$("historyPanel").classList.add("hidden");$("home").classList.remove("hidden");setEdit(false);window.scrollTo({top:$("level2").offsetTop-8,behavior:"smooth"})}};
$("clearHistoryBtn").onclick=()=>{if(confirm("确定清空全部历史记录吗？")){localStorage.removeItem(KEY);renderHistory()}};
window.addEventListener("beforeunload",()=>{if(window.speechSynthesis)speechSynthesis.cancel()});
</script></body></html>
