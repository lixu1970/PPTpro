<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>PPT生成</title>
<style>
*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(100%,560px);margin:auto;padding:16px 12px 42px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-size:1.65rem;text-align:center;margin:6px 0 16px}.section-title{font-size:1.2rem;font-weight:800;margin:4px 0 10px}
textarea{width:100%;height:170px;resize:none;overflow:auto;border:2px solid #d9dee8;border-radius:14px;padding:14px;font:inherit;line-height:1.65;background:#fff;color:#172033}
button{font-family:inherit}.primary,.secondary,.danger{width:100%;min-height:54px;border:0;border-radius:14px;font-size:1.08rem;font-weight:750;margin-top:10px}.primary{background:#1769e0;color:#fff}.secondary{background:#eaf2ff;color:#174ea6}.danger{background:#fff0f0;color:#b42318}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.row4 button{min-height:50px;border:0;border-radius:12px;font-size:.94rem;font-weight:750;padding:6px 2px}.summary{height:230px;overflow:auto;border:2px solid #e3e7ee;border-radius:14px;padding:14px;font-size:1.08rem;line-height:1.85;white-space:pre-wrap;background:#fbfcfe}.summary.editing{background:#fffbea;border-color:#f2c94c;outline:none}.hidden{display:none!important}
.version{text-align:center;font-size:.78rem;color:#98a2b3;margin:16px 0 0}.history-item{border-top:1px solid #e5e7eb;padding:14px 0}.history-item:first-child{border-top:0}.history-date{font-size:.82rem;color:#667085}.history-preview{line-height:1.55;margin:7px 0}.item-actions{display:flex;gap:8px}.item-actions button{flex:1;min-height:42px;border:0;border-radius:10px;font-size:.92rem}.empty{text-align:center;color:#98a2b3;padding:20px}
#pptArea{margin-top:14px}.ppt-title{text-align:center;font-size:1.28rem;font-weight:850;margin:8px 0 14px}.slide{aspect-ratio:16/9;width:100%;border-radius:12px;margin:0 0 12px;box-shadow:0 3px 16px rgba(0,0,0,.12);padding:8% 7%;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}.slide.light{background:linear-gradient(135deg,#ffffff 0%,#eef4ff 100%);color:#152238}.slide.dark{background:linear-gradient(135deg,#101828 0%,#253858 100%);color:#fff}.slide.warm{background:linear-gradient(135deg,#fffaf0 0%,#f6e7cf 100%);color:#3c2f24}.slide .num{position:absolute;right:5%;bottom:5%;font-size:.65rem;opacity:.55}.slide h2{font-size:clamp(1.35rem,5.2vw,2rem);margin:0 0 7%;line-height:1.22}.slide p{font-size:clamp(.82rem,3.4vw,1.18rem);line-height:1.7;margin:0;white-space:pre-wrap}.slide.cover{text-align:center;align-items:center}.slide.cover h2{font-size:clamp(1.65rem,6vw,2.35rem);margin-bottom:5%}.slide.cover p{opacity:.8}.slide.editable{outline:3px solid #f2c94c;cursor:text}.slide[contenteditable="true"]{user-select:text;-webkit-user-select:text}
@media(max-width:380px){html{font-size:17px}main{padding-left:9px;padding-right:9px}.row4{grid-template-columns:1fr 1fr}.row4 button{font-size:1rem}}
</style>
</head>
<body><main>
<section id="home">
  <div class="card" id="level1">
    <h1>PPT生成</h1>
    <textarea id="sourceText" placeholder="在这里粘贴文章……"></textarea>
    <button id="extractBtn" class="primary">开始提炼</button>
    <button id="historyBtn" class="secondary">历史记录</button>
    <div class="version">V1.0.0 · 260830-1350</div>
  </div>

  <div id="level2" class="hidden">
    <div class="card">
      <div class="section-title">精华</div>
      <div id="summary" class="summary"></div>
      <div class="row"><button id="enhanceBtn" class="secondary">增强</button><button id="speakToggleBtn" class="secondary">朗读/停止</button></div>
      <button id="generatePptBtn" class="primary">PPT生成</button>
    </div>
  </div>

  <div id="level3" class="hidden">
    <div class="card">
      <div id="pptArea"></div>
      <div class="row4">
        <button id="editPptBtn" class="secondary">修改</button>
        <button id="savePptBtn" class="secondary">保存</button>
        <button id="downloadPptBtn" class="primary">下载</button>
        <button id="clearPptBtn" class="danger">清屏</button>
      </div>
    </div>
  </div>
</section>

<section id="historyPanel" class="hidden">
  <div class="card">
    <h1>历史记录</h1>
    <button id="backBtn" class="secondary">返回</button>
    <div id="historyList"></div>
    <button id="clearHistoryBtn" class="danger">清空历史</button>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
const $=id=>document.getElementById(id), clean=s=>(s||"").replace(/\s+/g,"").trim();
const STOP=new Set("的 了 和 是 在 有 我 你 他 她 它 这 那 就 也 都 而 与 及 或 被 把 对 为 从 到 将 一个 一种 我们 他们 可以 需要 进行 以及 如果 因为 所以 但是 不是 没有 什么 如何 这个 那个 这些 那些".split(" "));
const KEY="pptGeneratorHistoryV1"; let current=null, speaking=false, pptEditing=false;
function sentences(text){return (text||"").replace(/\r/g,"").split(/(?<=[。！？!?；;])|\n+/).map(s=>s.trim()).filter(Boolean)}
function targetLen(text){const n=clean(text).length;return n?Math.max(20,Math.round(n/30)):0}
function tokens(text){const zh=(text.match(/[\u4e00-\u9fff]{2,6}/g)||[]),en=(text.toLowerCase().match(/[a-z][a-z0-9-]{2,}/g)||[]),parts=[];zh.forEach(x=>{for(let n=Math.min(4,x.length);n>=2;n--)for(let i=0;i+n<=x.length;i++)parts.push(x.slice(i,i+n))});return parts.concat(en).filter(x=>!STOP.has(x))}
function keywords(text,max=10){const f=new Map();tokens(text).forEach(t=>f.set(t,(f.get(t)||0)+1));let a=[...f].sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).map(x=>x[0]),out=[];for(const w of a){if(!out.some(x=>x.includes(w)||w.includes(x))){out.push(w);if(out.length>=max)break}}return out}
function summarize(text,target){const ss=sentences(text);if(!ss.length)return"";if(clean(text).length<=Math.max(target*2,80))return ss.join("");const ks=keywords(text,8);let scored=ss.map((s,i)=>({s,i,len:clean(s).length,score:(i===0?2:0)+(i===ss.length-1?1:0)+ks.reduce((n,k)=>n+(s.includes(k)?2.5:0),0)+Math.min(clean(s).length/50,1)})).filter(x=>x.len>=8).sort((a,b)=>b.score-a.score||a.i-b.i);let picked=[],len=0,hard=Math.max(target*1.9,80);for(const x of scored){if(!picked.length||len<target){if(len+x.len<=hard||!picked.length){picked.push(x);len+=x.len}}}picked.sort((a,b)=>a.i-b.i);let out=picked.map(x=>x.s).join("");if(out&&!/[。！？!?]$/.test(out))out+="。";return out}
function enhanceSummary(src,cur,target){const ss=sentences(src).filter(s=>clean(s).length>=8),ks=keywords(src,10);if(!ss.length)return cur;let c=ss.map((s,i)=>({s,i,len:clean(s).length,score:ks.reduce((n,k)=>n+(s.includes(k)?3:0),0)+(i===0?1.5:0)+(i===ss.length-1?1:0)})).sort((a,b)=>b.score-a.score||a.i-b.i),out=[],len=0,max=Math.max(target*2.1,100);for(const x of c){if(!out.length||(len<target*1.35&&len+x.len<=max)){out.push(x);len+=x.len}if(len>=target*1.35)break}out.sort((a,b)=>a.i-b.i);let t=out.map(x=>x.s.replace(/^[，、；;：:\s]+/,"")).join("").replace(/([。！？])\1+/g,"$1");if(t&&!/[。！？!?]$/.test(t))t+="。";return t||cur}
function makeTitle(summary,ks){let first=sentences(summary)[0]||"内容提炼";first=first.replace(/[。！？；].*$/g,"");if(first.length>20)first=(ks.slice(0,2).join(" · ")||first.slice(0,18));return first||"内容提炼"}
function chunkSlides(summary){const ss=sentences(summary),ks=keywords(summary,12);if(!ss.length)return[];let groups=[],cur=[],chars=0;const maxChars=summary.length<120?60:summary.length<300?85:110;for(const s of ss){const l=clean(s).length;if(cur.length&&(chars+l>maxChars||cur.length>=3)){groups.push(cur);cur=[];chars=0}cur.push(s);chars+=l}if(cur.length)groups.push(cur);if(groups.length===1&&ss.length>=2){const mid=Math.ceil(ss.length/2);groups=[ss.slice(0,mid),ss.slice(mid)]}return groups.map((g,i)=>{let hit=ks.find(k=>g.join("").includes(k));let title=hit||("要点 "+(i+1));return{title,text:g.join("\n")}})}
function buildDeck(summary){const ks=keywords(summary,10),title=makeTitle(summary,ks),body=chunkSlides(summary);let slides=[{type:"cover",title, text:ks.slice(0,4).join(" · ")||"精华提炼"}];body.forEach((x,i)=>slides.push({type:"body",title:x.title,text:x.text,theme:["light","dark","warm"][i%3]}));slides.push({type:"end",title:"核心回顾",text:(ks.slice(0,6).join(" · ")||summary.slice(0,60)),theme:"dark"});return{title,slides}}
function renderDeck(deck){const box=$("pptArea");box.innerHTML='<div class="ppt-title">'+esc(deck.title)+'</div>'+deck.slides.map((s,i)=>'<div class="slide '+(s.type==="cover"?'cover dark':(s.theme||"light"))+'" data-i="'+i+'"><h2>'+esc(s.title)+'</h2><p>'+esc(s.text).replace(/\n/g,"<br>")+'</p><span class="num">'+(i+1)+' / '+deck.slides.length+'</span></div>').join("");}
function syncDeckFromDom(){if(!current?.deck)return;document.querySelectorAll("#pptArea .slide").forEach(el=>{const i=+el.dataset.i;current.deck.slides[i].title=el.querySelector("h2").innerText.trim();current.deck.slides[i].text=el.querySelector("p").innerText.trim()});current.deck.title=current.deck.slides[0]?.title||current.deck.title;current.dirty=true}
function setEdit(on){pptEditing=on;document.querySelectorAll("#pptArea .slide").forEach(el=>{el.contentEditable=on?"true":"false";el.classList.toggle("editable",on)});$("editPptBtn").textContent=on?"完成修改":"修改";if(!on)syncDeckFromDom()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loadHistory(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function saveHistoryRecord(){if(!current?.deck)return;syncDeckFromDom();let a=loadHistory(),now=new Date().toISOString(),id=current.savedId||Date.now(),r={id,createdAt:now,source:current.source,summary:current.summary,deck:current.deck};a=a.filter(x=>x.id!==id);a.unshift(r);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)));current.savedId=id;current.dirty=false;alert("已保存到历史记录。")}
function renderHistory(){const a=loadHistory(),box=$("historyList");if(!a.length){box.innerHTML='<div class="empty">还没有历史记录</div>';return}box.innerHTML=a.map(r=>'<div class="history-item" data-id="'+r.id+'"><div class="history-date">'+new Date(r.createdAt).toLocaleString("zh-CN")+'</div><div class="history-preview">'+esc(r.deck?.title||r.summary?.slice(0,40)||"PPT")+'</div><div class="item-actions"><button class="open secondary">打开</button><button class="del danger">删除</button></div></div>').join("")}
function speakToggle(){if(!("speechSynthesis" in window)){alert("当前浏览器不支持朗读。");return}if(speaking||speechSynthesis.speaking){speechSynthesis.cancel();speaking=false;return}if(!current?.summary)return;const u=new SpeechSynthesisUtterance(current.summary);u.lang="zh-CN";u.rate=.92;u.onend=()=>speaking=false;u.onerror=()=>speaking=false;speaking=true;speechSynthesis.speak(u)}
async function downloadPpt(){if(!current?.deck)return;syncDeckFromDom();if(typeof PptxGenJS==="undefined"){alert("PPT下载组件未加载，请联网后重新打开网页再下载。");return}const pptx=new PptxGenJS();pptx.layout="LAYOUT_WIDE";pptx.author="PPT生成";pptx.subject=current.deck.title;pptx.title=current.deck.title;pptx.company="PPT生成";pptx.lang="zh-CN";
 const themes={light:{bg:"F7F9FC",fg:"172033",accent:"1769E0"},dark:{bg:"101828",fg:"FFFFFF",accent:"84ADFF"},warm:{bg:"FFF8ED",fg:"3C2F24",accent:"B54708"}};
 current.deck.slides.forEach((s,i)=>{let slide=pptx.addSlide(),th=s.type==="cover"?themes.dark:themes[s.theme]||themes.light;slide.background={color:th.bg};slide.addShape(pptx.ShapeType.rect,{x:0,y:0,w:13.333,h:.12,fill:{color:th.accent},line:{color:th.accent}});if(s.type==="cover"){slide.addText(s.title,{x:1.05,y:2.0,w:11.2,h:1.1,fontFace:"Microsoft YaHei",fontSize:28,bold:true,color:th.fg,align:"center",margin:0});slide.addText(s.text,{x:1.1,y:3.35,w:11.1,h:.65,fontFace:"Microsoft YaHei",fontSize:15,color:th.fg,align:"center",breakLine:false,margin:0,transparency:15})}else{slide.addText(s.title,{x:.9,y:.75,w:11.5,h:.65,fontFace:"Microsoft YaHei",fontSize:24,bold:true,color:th.fg,margin:0});slide.addShape(pptx.ShapeType.line,{x:.9,y:1.52,w:1.25,h:0,line:{color:th.accent,width:3}});slide.addText(s.text,{x:1.0,y:1.9,w:11.2,h:4.7,fontFace:"Microsoft YaHei",fontSize:18,color:th.fg,breakLine:false,margin:.08,valign:"mid",paraSpaceAfterPt:12,fit:"shrink"})}slide.addText(String(i+1).padStart(2,"0"),{x:12.05,y:6.85,w:.55,h:.25,fontFace:"Arial",fontSize:8,color:th.fg,transparency:45,align:"right",margin:0})});
 const safe=(current.deck.title||"PPT生成").replace(/[\\/:*?"<>|]/g,"_").slice(0,28);await pptx.writeFile({fileName:safe+".pptx"});}

$("extractBtn").onclick=()=>{const src=$("sourceText").value;if(!clean(src)){alert("请先粘贴文章。");return}const target=targetLen(src),sum=summarize(src,target);current={source:src,summary:sum,target,deck:null,dirty:false,savedId:null};$("summary").textContent=sum;$("level2").classList.remove("hidden");$("level3").classList.add("hidden");$("level2").scrollIntoView({behavior:"smooth",block:"start"})};
$("enhanceBtn").onclick=()=>{if(!current)return;current.summary=enhanceSummary(current.source,current.summary,current.target);$("summary").textContent=current.summary;current.deck=null;current.dirty=true;$("level3").classList.add("hidden")};
$("speakToggleBtn").onclick=speakToggle;
$("generatePptBtn").onclick=()=>{if(!current)return;current.summary=$("summary").innerText.trim()||current.summary;current.deck=buildDeck(current.summary);current.dirty=true;renderDeck(current.deck);$("level3").classList.remove("hidden");setEdit(false);$("level3").scrollIntoView({behavior:"smooth",block:"start"})};
$("editPptBtn").onclick=()=>setEdit(!pptEditing);$("savePptBtn").onclick=saveHistoryRecord;$("downloadPptBtn").onclick=downloadPpt;
$("clearPptBtn").onclick=()=>{if(!current?.deck)return;if(current.dirty&&!current.savedId){alert("请先保存到历史记录，再清屏。");return}if(pptEditing)setEdit(false);$("pptArea").innerHTML="";$("level3").classList.add("hidden");current.deck=null;window.scrollTo({top:$("level2").offsetTop-8,behavior:"smooth"})};
$("historyBtn").onclick=()=>{$("home").classList.add("hidden");$("historyPanel").classList.remove("hidden");renderHistory();window.scrollTo(0,0)};$("backBtn").onclick=()=>{$("historyPanel").classList.add("hidden");$("home").classList.remove("hidden");window.scrollTo(0,0)};
$("historyList").onclick=e=>{const item=e.target.closest(".history-item");if(!item)return;let a=loadHistory(),id=Number(item.dataset.id),r=a.find(x=>x.id===id);if(e.target.classList.contains("del")){localStorage.setItem(KEY,JSON.stringify(a.filter(x=>x.id!==id)));renderHistory();return}if(e.target.classList.contains("open")&&r){current={source:r.source||"",summary:r.summary||"",target:targetLen(r.source||""),deck:r.deck,dirty:false,savedId:r.id};$("sourceText").value=current.source;$("summary").textContent=current.summary;renderDeck(current.deck);$("level2").classList.remove("hidden");$("level3").classList.remove("hidden");$("historyPanel").classList.add("hidden");$("home").classList.remove("hidden");setEdit(false);window.scrollTo({top:$("level2").offsetTop-8,behavior:"smooth"})}};
$("clearHistoryBtn").onclick=()=>{if(confirm("确定清空全部历史记录吗？")){localStorage.removeItem(KEY);renderHistory()}};
window.addEventListener("beforeunload",()=>{if(window.speechSynthesis)speechSynthesis.cancel()});
</script></body></html>
